# Python bridge and templates. Matches qaas: Python 3.12.
target-version = "py312"
line-length = 120
include = ["python/**/*.py", "templates/**/*.py"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[format]
quote-style = "double"

[lint.per-file-ignores]
# The bridge starts on any Python 3 to report an unsuitable interpreter: keep it free of 3.11+ APIs.
"python/qaas_bridge.py" = ["UP017"]
