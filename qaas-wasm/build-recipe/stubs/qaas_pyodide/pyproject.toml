[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "qaas-pyodide"
version = "0.1.1"
description = "Browser (Pyodide) adapter for qaas / qheappe_client: fetch transport and JSPI sync API."
requires-python = ">=3.12"
dependencies = ["qaas", "aiohttp", "yarl"]
[tool.setuptools.packages.find]
where = ["src"]
